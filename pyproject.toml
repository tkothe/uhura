[project]
name = "uhura"
version = "0.1.0"
description = "Hailing frequencies open: place phone calls through an AI voice agent, with guardrails and human steering."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "phonenumbers>=8.13",
    "mcp>=2",
    "websockets>=17.1",
]

[project.scripts]
uhura = "uhura.cli:main"
uhura-mcp = "uhura.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uhura"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are meant to be used as argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]
